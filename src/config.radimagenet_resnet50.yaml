# RSNA knee MRI - RadImageNet ResNet-50 encoder in the 2.5D MIL model (example config).
# Same pipeline as config.yaml; only data.encoder_normalization and the model encoder keys
# differ. The freeze setting below is a starting experiment, not a tuned optimum.
#   python -m knee_mri.cli train --config src/config.radimagenet_resnet50.yaml --mode fold
# These values are starting hypotheses, not tuned optima.
# Every key can be overridden from the CLI, e.g.: --set data.image_size=288

seed: 42

paths:
  # Root of the competition export. All *_csv / dicom_root entries below default
  # to the usual layout under this root when left as null.
  data_root: "F:/Kaggle/data"
  dicom_root: null                 # default: <data_root>/train_series
  # train_csv: "F:/Kaggle/data/train_v1.csv"   # binary labels (default: <data_root>/train.csv)
  # train_csv: "F:/Kaggle/data/train_v2.csv"     # soft labels
  train_csv: "F:/Kaggle/data/train_v3.csv"     # soft labels (qwen+gpt)
  train_series_csv: null           # default: <data_root>/train_series.csv

  # Report-extraction exports (optional; see README "Label adapters").
  labels_details_csv: null                       # preferred: one row per (study, target) + status
  labels_statuses_csv: null                      # wide text-status export
  labels_predictions_csv: null                   # wide numeric export
  labels_predictions_exclude_borderline_csv: null
  # Radiologist reference set: 158 studies (the original 58 + 100). Audit only (diagnose, evaluate);
  # held out from image training only with split.holdout_reference=true (default false).
  reference_csv: "notebooks/train_labeled_158_reference.csv"
  # Validation reference frozen once by `freeze-reference` (from train_v1.csv). Every
  # training-label experiment is scored against this same file; null = derive it from
  # the current label table, which then moves with the label policy.
  # frozen_reference_csv: "work/labels/frozen_reference.csv"
  frozen_reference_csv: "work/labels/frozen_reference_v3.csv"
  laterality_csv: null             # default: <work_dir>/manifest/laterality.csv
  series_selection_csv: null       # default: <work_dir>/manifest/series_selection.csv; the dataset checks every cache entry against it

  work_dir: "work"
  cache_dir: "I:/Kaggle/data/cache"  # null = <work_dir>/cache (moved from H: for disk space)
  output_dir: null                 # default: <work_dir>/runs/<train_csv stem>, e.g. runs/train_v3

manifest:
  # Probe-decode one file per candidate volume while building the manifest.
  decode_probe: true
  # A volume with fewer usable slices than this is unusable as a slot.
  min_slices: 4
  # Tolerance for assigning a plane from the slice normal (degrees off-axis).
  obliquity_tolerance_deg: 35.0
  # Neighbouring slices whose centre-to-centre distance exceeds
  # median_spacing * max_gap_ratio are flagged as unsuitable 2.5D neighbours.
  max_gap_ratio: 1.75
  workers: 8

selection:
  # Ranking heuristic for "one usable series per slot". Image-side information only.
  prefer_fluid_sensitive: true
  localizer_patterns: ["localiz", "localis", "scout", "survey", "loc_", "3-pl", "3pl", "plan"]
  weights:
    fluid_sensitive: 3.0
    fat_suppression: 0.5
    te_pd_t2: 2.0
    slice_count: 1.0
    inplane_resolution: 0.5
    plane_confidence: 1.0
    quality_penalty: 2.0

data:
  image_size: 224
  fov_mm: 150.0
  series_slots: ["sagittal", "coronal", "axial"]  # optional extra slot: "coronal_t1" (non-FS T1, constants.SLOT_FILTERS)
  centers_per_series: 24
  adjacent_slices: 3
  crop_center: "foreground"        # foreground|foreground_extent|geometric (extent: midpoint between the skin lines)
  intensity_percentiles: [1.0, 99.0]
  # The official RadImageNet PyTorch demo feeds (uint8 - 127.5) * 2 / 255: [0, 1] -> [-1, 1],
  # i.e. mean 0.5 / std 0.5 per channel on our [0, 1] robust-scaled slices.
  encoder_normalization: "radimagenet_torch"
  monochrome1_policy: "invert"       # invert|keep
  cache_dtype: "float16"
  # Data-quality gate: studies with no usable series at all.
  allow_all_missing_studies: false
  # Bring every study into one medial/lateral frame (laterality.py): right knees mirrored on
  # coronal/axial, sagittal slices ordered towards lateral. Needs `build-laterality` first.
  # Not part of the cache hash; the flip happens when a bag is read.
  laterality_canonical: false
  laterality_min_offset_mm: 20.0   # geometry fallback: |image-centre x| below this = unresolved

augment:
  enabled: true
  # Where the transform runs. cuda keeps the DataLoader workers on decode-and-gather only
  # and augments the whole micro-batch on the GPU; cpu augments inside the workers.
  # auto = cuda when one is visible. Training only - validation never augments.
  device: "auto"                   # auto|cpu|cuda
  rotation_deg: 10.0
  translate_frac: 0.05
  scale_range: [0.9, 1.1]
  intensity_gain: 0.1              # multiplicative jitter, +-gain
  intensity_bias: 0.05             # additive jitter, +-bias
  gamma_range: [0.85, 1.18]
  noise_std: 0.01

model:
  # efficientnet_b0 | efficientnet_v2_s | radimagenet_resnet50 | dinov2_vits14 (encoders.py).
  # b0 / v2_s give 1280 features at stride 32. Measured on the RTX 5080, 320 px, 72 triplets, bf16, one study:
  #   b0: 6.3 GB, 10.4 train study/s | v2_s: 11.1 GB, 5.6 study/s | v2_s + grad_checkpointing: 4.1 GB, 4.0 study/s
  # Switching the backbone is a new experiment: its pretrained weights, not another backbone's checkpoint.
  backbone: "radimagenet_resnet50"
  # The official RadImageNet PyTorch weights: RadImageNet_pytorch/ResNet50.pt from
  # RadImageNet_pytorch.zip (linked from github.com/BMEII-AI/RadImageNet). No download, no
  # ImageNet substitute: the file must exist (relative paths: cwd, then the repository root).
  weights: "work/pretrained/RadImageNet_pytorch/ResNet50.pt"
  # Starting experiment: only the last residual stage (layer4) trains; stem and layer1-3 stay
  # frozen and in eval mode.
  encoder_trainable: "last_n"
  encoder_trainable_units: 1
  # Recompute each encoder stage in backward instead of storing its activations: less
  # training memory for ~30% less throughput, identical results. Only if microbatch/size would OOM.
  grad_checkpointing: false
  head_dropout: 0.2
  head_hidden: 256
  freeze_bn_running_stats: true
  encoder_chunk_size: 0            # 0 = no chunking (see README memory notes)
  # How one slice's feature map becomes a vector (see model.py):
  # avg = global average (original) | avgmax = average + maximum | attention = learned weights
  spatial_pool: "avg"
  # Per-target attention over (slot, depth zone, map half) window tokens, added to the head's
  # logits (model.py). Meant together with data.laterality_canonical; needs spatial_pool=avg.
  target_attention: false
  attention_dim: 256
  depth_zones: 3
  # Side pooling (model.py): the head gets one mean/max per side of each slot (coronal/axial
  # column halves = medial | lateral, sagittal depth zones = medial / central / lateral)
  # instead of one per slot. Needs data.laterality_canonical and spatial_pool=avg.
  side_pooling: false

labels:
  source: "auto"                   # auto|details|wide|train_csv
  borderline_policy: "exclude"     # exclude|as_negative
  unmentioned_weight: 0.0          # 0.0 | 0.2 | 1.0 (weak negative ablations)
  # Per-target override of unmentioned_weight, e.g. {Synovitis: 0.0, Fracture: 0.2}.
  # Needs a source that keeps not_mentioned apart (labels.source=details).
  unmentioned_weight_per_target: {}
  uncertain_weight: 0.0
  allow_soft_targets: true         # continuous targets in (0, 1): wide export, or soft_target/p_positive in details
  # Minimum labelled coverage / class support required for a full training run.
  min_labeled_studies: 500
  min_positives_per_target: 10

split:
  n_folds: 3
  fold: 0
  grouping: "auto"                 # auto|patient|study
  holdout_reference: false         # false: the 58 reference studies train too (no independent audit set)
  max_studies_per_patient_id: 20   # above this an ID is treated as site-reused, not a patient

train:
  microbatch_studies: 1
  accumulation_steps: 8
  # microbatch: class-normalise each micro-batch (original; label weights only act as 0/non-0)
  # window: normalise by the whole window's valid-label counts (see loss.py) - experiment L1
  # global: fixed per-class denominators from the training set (see loss.py) - needed for weak labels
  loss_normalization: "global"
  max_epochs: 25
  warmup_epochs: 2
  early_stopping_patience: 5
  # Weight EMA per optimizer step (0 = off). The EMA weights are validated, selected and saved
  # as best.pt "model"; the raw weights are scored too (history *_raw). 0.999 ~ 1000 steps.
  ema_decay: 0.0
  encoder_lr: 0.0001
  head_lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  num_workers: 8                   # 8 for Windows, 0 by default
  prefetch_factor: 4               # 4 for Windows, null by default
  # Validation loader budget (null = same as the training loader). Its workers are never
  # persistent, so they do not hold memory through the training epoch.
  eval_num_workers: 4
  eval_prefetch_factor: 2
  amp: "auto"                      # auto|bf16|fp16|fp32
  eval_batch_studies: 2
  log_every: 20
  resume: null                     # path to last.pt: continue the SAME run exactly (checked)
  init_weights: null               # path to a checkpoint: NEW run from its weights (fresh optimizer/best/history)

eval:
  threshold: 0.5
  min_class_support: 1             # known positives AND negatives needed for AUC
  # Early stopping / checkpoint metric. macro_soft_auc equals macro_roc_auc on a binary
  # reference and also ranks continuous reference values (see metrics.soft_roc_auc).
  selection_metric: "macro_soft_auc"   # macro_soft_auc|macro_roc_auc
